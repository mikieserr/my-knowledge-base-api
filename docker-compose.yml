services:
  storage:
    image: pgsty/silo:latest
    container_name: kb-silo
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kbadmin
      MINIO_ROOT_PASSWORD: kbsecret
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web UI
    volumes:
      - silo_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5


  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kb-app
    depends_on:
      storage:
        condition: service_healthy
    environment:
      S3_ENDPOINT: http://storage:9000
      S3_ACCESS_KEY: kbadmin
      S3_SECRET_KEY: kbsecret
      S3_BUCKET: kb-attachments

    command: tail -f /dev/null


  manticore:
    image: manticoresearch/manticore:29.0.2
    container_name: kb-manticore
    restart: unless-stopped
    ports:
      - "9306:9306" # MySQL
      - "9308:9308" # HTTP API
    volumes:
      - manticore_data:/var/lib/manticore
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
      memlock:
        soft: -1
        hard: -1

volumes:
    silo_data:
    manticore_data: # Не забудь добавить в секцию volumes